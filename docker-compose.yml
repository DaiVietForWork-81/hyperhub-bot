version: '3.8'

services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord_cp_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot.db:/app/bot.db
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
      - /var/run/docker.sock:/var/run/docker.sock # Allows spawning isolated sandbox containers
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
